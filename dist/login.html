<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Mama Meals</title>
    <link rel="stylesheet" href="assets/css/style.min.css">
</head>
<body class="account-page">
    <header class="checkout-header">
        <a class="back-link" href="index.html" aria-label="Return to Mama Meals home page">Back</a>
        <div>
            <span class="location-kicker">Welcome back</span>
            <h1>Log In</h1>
        </div>
    </header>

    <main class="account-layout auth-layout">
        <section class="checkout-panel auth-panel">
            <h2>Access your customer account</h2>
            <p class="support-copy">Sign in to manage saved addresses, payments, favorites, and orders.</p>

            <form class="account-form" data-auth-form="login" action="account.html">
                <label class="field-label" for="login-id">Phone Number or Email</label>
                <input class="text-field" id="login-id" name="loginId" type="text" required>

                <label class="field-label" for="login-password">Password</label>
                <input class="text-field" id="login-password" name="password" type="password" required>

                <label class="checkbox-row">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>

                <button class="place-order-button" type="submit">Log In</button>
                <p class="auth-message" data-auth-message hidden></p>
            </form>

            <div class="auth-links">
                <a href="#" data-password-reset>Forgot Password?</a>
                <a href="register.html">Don't have an account? Sign Up here</a>
            </div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
        <a class="nav-item" href="index.html" aria-label="Home"><span class="nav-icon" aria-hidden="true">&#8962;</span></a>
        <a class="nav-item" href="order-history.html" aria-label="Orders"><span class="nav-icon" aria-hidden="true">&#9636;</span></a>
        <a class="nav-item active" href="account.html" aria-label="Account" aria-current="page"><span class="nav-icon" aria-hidden="true">&#9675;</span></a>
    </nav>

    <script src="assets/js/app.min.js"></script>
</body>
</html>
