<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - Mama Meals</title>
    <link rel="stylesheet" href="assets/css/style.min.css">
</head>
<body class="account-page">
    <header class="checkout-header">
        <a class="back-link" href="account.html" aria-label="Return to my account">Back</a>
        <div>
            <span class="location-kicker">Order activity</span>
            <h1>Order History</h1>
        </div>
        <span data-auth-actions>
            <a class="auth-link" href="register.html">Sign Up</a>
            <a class="auth-link" href="login.html">Log In</a>
        </span>
        <a class="auth-welcome" href="account.html" data-auth-welcome hidden></a>
    </header>

    <main class="account-layout order-history-layout">
        <section class="checkout-empty visible" id="order-empty-state">
            <h2>You have no orders yet. Add items to your cart and place your first order!</h2>
            <a class="primary-link" href="index.html">Browse Meals</a>
        </section>

        <section id="order-history-list"></section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
        <a class="nav-item" href="index.html" aria-label="Home"><span class="nav-icon" aria-hidden="true">&#8962;</span></a>
        <a class="nav-item active" href="order-history.html" aria-label="Orders" aria-current="page"><span class="nav-icon" aria-hidden="true">&#9636;</span></a>
        <a class="nav-item" href="account.html" aria-label="Account"><span class="nav-icon" aria-hidden="true">&#9675;</span></a>
    </nav>

    <script src="assets/js/app.min.js"></script>
</body>
</html>
